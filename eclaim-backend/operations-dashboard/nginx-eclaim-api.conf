# E-Claims API + Operations Dashboard (HTTPS)
# Install:
#   sudo cp nginx-eclaim-api.conf /etc/nginx/sites-available/eclaim-api
#   sudo ln -sf /etc/nginx/sites-available/eclaim-api /etc/nginx/sites-enabled/eclaim-api
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL certs (pick one):
#   A) certbot: /etc/letsencrypt/live/eclaim-api.apeiro-digital.com/
#   B) manual:  /etc/nginx/ssl/eclaim-api/fullchain.pem + privkey.pem

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name eclaim-api.apeiro-digital.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eclaim-api.apeiro-digital.com;

    # --- SSL (Let's Encrypt — change domain folder if different) ---
    ssl_certificate     /etc/letsencrypt/live/eclaim-api.apeiro-digital.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eclaim-api.apeiro-digital.com/privkey.pem;

    # --- Or manual certs copied to /etc/nginx/ssl/eclaim-api/ ---
    # ssl_certificate     /etc/nginx/ssl/eclaim-api/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/eclaim-api/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Operations dashboard (on-chain analytics)
    location /operation/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /operation {
        return 301 /operation/;
    }

    # NestJS e-claims API
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
